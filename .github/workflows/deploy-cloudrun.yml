name: Deploy backend to Cloud Run

# CI/CD real (infra-01/infra-03, 21/08/2026): substitui o deploy manual
# (`infra/deploy-cloudrun.sh`, gcloud rodado na mao). Auth GCP via Workload
# Identity Federation -- sem chave de SA em secret nenhum (pool ja existe,
# projeto rangel-tech, escopo repository_owner=='RangelTech').
#
# Todo segredo de aplicacao vem do Infisical (projeto "agent-llm-backend",
# env prod) via Machine Identity propria -- unicos 2 secrets deste repo no
# GitHub sao INFISICAL_CLIENT_ID/INFISICAL_CLIENT_SECRET.
#
# SPA embutida no mesmo container (_mount_spa, backend/Dockerfile builda o
# frontend) -- decisao de reverter a separacao Cloud Storage/CDN, 21/08/2026.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/cloudbuild-backend.yaml"
      - "infra/terraform/**"
      - ".github/workflows/deploy-cloudrun.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/234554472049/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-deployer@rangel-tech.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Fetch secrets from Infisical
        id: infisical
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsS -X POST "https://infisical.rangeltech.net/api/v1/auth/universal-auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"clientId\":\"${{ secrets.INFISICAL_CLIENT_ID }}\",\"clientSecret\":\"${{ secrets.INFISICAL_CLIENT_SECRET }}\"}" \
            | jq -r '.accessToken')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Failed to authenticate with Infisical" >&2
            exit 1
          fi
          echo "::add-mask::$TOKEN"

          fetch_secret() {
            local name="$1"
            local value
            value=$(curl -fsS "https://infisical.rangeltech.net/api/v3/secrets/raw/$name?workspaceId=b4203358-1215-43a9-a821-218a6f587c3e&environment=prod&secretPath=%2F" \
              -H "Authorization: Bearer $TOKEN" | jq -r '.secret.secretValue')
            if [ -z "$value" ] || [ "$value" = "null" ]; then
              echo "::error::Secret $name not found in Infisical" >&2
              exit 1
            fi
            echo "::add-mask::$value" >&2
            echo "$value"
          }

          {
            echo "database_url<<EOF_DB"
            fetch_secret DATABASE_URL
            echo "EOF_DB"
            echo "encryption_key<<EOF_ENC"
            fetch_secret ENCRYPTION_KEY
            echo "EOF_ENC"
            echo "kernel_internal_token<<EOF_KIT"
            fetch_secret KERNEL_INTERNAL_TOKEN
            echo "EOF_KIT"
            echo "bridge_admin_token<<EOF_BAT"
            fetch_secret BRIDGE_ADMIN_TOKEN
            echo "EOF_BAT"
            echo "s3_access_key_id<<EOF_S3A"
            fetch_secret S3_ACCESS_KEY_ID
            echo "EOF_S3A"
            echo "s3_secret_access_key<<EOF_S3S"
            fetch_secret S3_SECRET_ACCESS_KEY
            echo "EOF_S3S"
          } >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          gcloud builds submit --project=rangel-tech \
            --config=infra/cloudbuild-backend.yaml \
            --substitutions=SHORT_SHA=${{ github.sha }} .

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init -input=false

      - name: Terraform import (no-op if already tracked)
        working-directory: infra/terraform
        timeout-minutes: 3
        env:
          # terraform import valida o modulo inteiro antes de importar (achado
          # real, 21/08/2026) -- precisa das mesmas TF_VAR_* do apply, senao
          # falha com "No value for required variable", o import nunca roda
          # (erro escondido pelo `|| true`) e o apply seguinte tenta CREATE
          # num recurso que ja existe -> 409.
          TF_VAR_image: us-central1-docker.pkg.dev/rangel-tech/containers/agent-platform-backend:${{ github.sha }}
          TF_VAR_database_url: ${{ steps.infisical.outputs.database_url }}
          TF_VAR_encryption_key: ${{ steps.infisical.outputs.encryption_key }}
          TF_VAR_kernel_internal_token: ${{ steps.infisical.outputs.kernel_internal_token }}
          TF_VAR_bridge_admin_token: ${{ steps.infisical.outputs.bridge_admin_token }}
          TF_VAR_s3_access_key_id: ${{ steps.infisical.outputs.s3_access_key_id }}
          TF_VAR_s3_secret_access_key: ${{ steps.infisical.outputs.s3_secret_access_key }}
        run: |
          terraform import -input=false -lock=false google_cloud_run_v2_service.agent_llm_backend \
            projects/rangel-tech/locations/us-central1/services/agent-llm-backend || true
          terraform import -input=false -lock=false google_cloud_run_v2_service_iam_member.public \
            "projects/rangel-tech/locations/us-central1/services/agent-llm-backend roles/run.invoker allUsers" || true

      - name: Terraform apply
        working-directory: infra/terraform
        env:
          TF_VAR_image: us-central1-docker.pkg.dev/rangel-tech/containers/agent-platform-backend:${{ github.sha }}
          TF_VAR_database_url: ${{ steps.infisical.outputs.database_url }}
          TF_VAR_encryption_key: ${{ steps.infisical.outputs.encryption_key }}
          TF_VAR_kernel_internal_token: ${{ steps.infisical.outputs.kernel_internal_token }}
          TF_VAR_bridge_admin_token: ${{ steps.infisical.outputs.bridge_admin_token }}
          TF_VAR_s3_access_key_id: ${{ steps.infisical.outputs.s3_access_key_id }}
          TF_VAR_s3_secret_access_key: ${{ steps.infisical.outputs.s3_secret_access_key }}
        run: terraform apply -input=false -lock=false -auto-approve

      - name: Smoke check
        # min-instances=0 -- a revisao nova pode precisar de cold start logo
        # apos o deploy, retry curto absorve isso sem marcar o CI como falho
        # por flakiness de timing (achado real, 21/08/2026).
        run: |
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors \
            "https://ia.rangeltech.net/health/ready" | grep -q '"status":"ready"'
