name: Deploy Custom Tool Runner

on:
  push:
    branches: [main]
    paths:
      - "custom_tool_runner/**"
      - "infra/cloudbuild-custom-tool-runner.yaml"
      - "infra/terraform-custom-tools/**"
      - ".github/workflows/deploy-custom-tool-runner.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/234554472049/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-deployer@rangel-tech.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Fetch runner secrets from Infisical
        id: infisical
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsS --retry 4 --retry-all-errors -X POST "https://infisical.rangeltech.net/api/v1/auth/universal-auth/login" -H "Content-Type: application/json" -d "{\"clientId\":\"${{ secrets.INFISICAL_CLIENT_ID }}\",\"clientSecret\":\"${{ secrets.INFISICAL_CLIENT_SECRET }}\"}" | jq -r '.accessToken')
          test -n "$TOKEN" && test "$TOKEN" != null
          fetch() { curl -fsS --retry 4 --retry-all-errors "https://infisical.rangeltech.net/api/v3/secrets/raw/$1?workspaceId=b4203358-1215-43a9-a821-218a6f587c3e&environment=prod&secretPath=%2F" -H "Authorization: Bearer $TOKEN" | jq -r '.secret.secretValue'; }
          { echo "database_url<<EOF"; fetch DATABASE_URL; echo EOF; echo "encryption_key<<EOF"; fetch ENCRYPTION_KEY; echo EOF; echo "kernel_internal_token<<EOF"; fetch KERNEL_INTERNAL_TOKEN; echo EOF; } >> "$GITHUB_OUTPUT"
      - name: Build image
        run: gcloud builds submit --project=rangel-tech --config=infra/cloudbuild-custom-tool-runner.yaml --substitutions=SHORT_SHA=${{ github.sha }} .
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.5" }
      - name: Apply
        working-directory: infra/terraform-custom-tools
        env:
          TF_VAR_image: us-central1-docker.pkg.dev/rangel-tech/containers/custom-tool-runner:${{ github.sha }}
          TF_VAR_database_url: ${{ steps.infisical.outputs.database_url }}
          TF_VAR_encryption_key: ${{ steps.infisical.outputs.encryption_key }}
          TF_VAR_kernel_internal_token: ${{ steps.infisical.outputs.kernel_internal_token }}
        run: |
          terraform init -input=false
          terraform import -input=false -lock=false google_cloud_run_v2_service.runner projects/rangel-tech/locations/us-central1/services/custom-tool-runner || true
          terraform import -input=false -lock=false google_cloud_run_v2_service_iam_member.public "projects/rangel-tech/locations/us-central1/services/custom-tool-runner roles/run.invoker allUsers" || true
          terraform apply -input=false -lock=false -auto-approve
      - name: Smoke check
        run: curl -fsS --retry 5 --retry-all-errors "$(gcloud run services describe custom-tool-runner --project=rangel-tech --region=us-central1 --format='value(status.url)')/health" | grep -q '"status":"ok"'
