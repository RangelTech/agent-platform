name: Deploy backend to Cloud Run

# CI/CD real (infra-01/infra-03, 21/08/2026): substitui o deploy manual
# (`infra/deploy-cloudrun.sh`, gcloud rodado na mão). Auth via Workload
# Identity Federation -- sem chave de SA em secret nenhum (pool já existe,
# projeto rangel-tech, escopo repository_owner=='RangelTech').
#
# SPA embutida no mesmo container (_mount_spa, backend/Dockerfile builda o
# frontend) -- decisão de reverter a separação Cloud Storage/CDN, 21/08/2026.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/cloudbuild-backend.yaml"
      - ".github/workflows/deploy-cloudrun.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/234554472049/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-deployer@rangel-tech.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build image
        run: |
          gcloud builds submit --project=rangel-tech \
            --config=infra/cloudbuild-backend.yaml \
            --substitutions=SHORT_SHA=${{ github.sha }} .

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy agent-llm-backend \
            --project=rangel-tech --region=us-central1 \
            --image=us-central1-docker.pkg.dev/rangel-tech/containers/agent-platform-backend:${{ github.sha }} \
            --set-secrets=DATABASE_URL=agent-platform-database-url:latest,ENCRYPTION_KEY=agent-platform-encryption-key:latest,S3_ACCESS_KEY_ID=gcs-hmac-access-key:latest,S3_SECRET_ACCESS_KEY=gcs-hmac-secret-key:latest,KERNEL_INTERNAL_TOKEN=agent-platform-kernel-internal-token:latest,BRIDGE_ADMIN_TOKEN=agent-platform-bridge-admin-token:latest \
            --set-env-vars="KERNEL_URL=https://kernel-llm-pujq3pjmca-uc.a.run.app,PUBLIC_BASE_URL=https://ia.rangeltech.net,BRIDGE_URL=https://bridge.rangeltech.net,STORAGE_BACKEND=s3,S3_ENDPOINT_URL=https://storage.googleapis.com,S3_REGION=us-east-1,S3_BUCKET=rangel-tech-storage,S3_PREFIX=teste-ia/agent-llm,S3_PUBLIC_BASE_URL=https://storage.googleapis.com/rangel-tech-storage/teste-ia,AWS_REQUEST_CHECKSUM_CALCULATION=when_required,AWS_RESPONSE_CHECKSUM_VALIDATION=when_required" \
            --allow-unauthenticated \
            --memory=1Gi --cpu=1 --min-instances=0 --max-instances=5 \
            --timeout=300

      - name: Smoke check
        run: |
          curl -fsS "https://ia.rangeltech.net/health/ready" | grep -q '"status":"ready"'
