name: CI

# Kernel saiu deste repo (agent-llm mega spec, infra-05) — virou o repo
# kernel-llm, com seu próprio CI/CD (Cloud Run).
#
# Backend+frontend: migração pro Cloud Run em andamento (infra-01 seção 5,
# 21/08/2026) — job `deploy-cloudrun` abaixo sobe em PARALELO ao que já roda
# na VPS via `.github/workflows/deploy-vps.yml` (esse continua existindo e
# recebendo tráfego real até o corte de DNS ser decidido à parte). Diferente
# do deploy da VPS, este É gated por CI verde (`needs: [python, frontend]`) —
# achado de processo (memoria.md): o deploy da VPS nunca foi, fica registrado
# como pendência separada, não corrigido aqui.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: agent_llm
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U agent -d agent_llm"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: Test (unit + integration)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://agent:agent@localhost:5433/agent_llm
        run: python -m pytest -q -m "integration or not integration"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy-cloudrun:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [python, frontend]
    concurrency:
      group: agent-platform-cloudrun-production
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Fetch secrets from Infisical
        id: infisical
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsS -X POST "https://infisical.rangeltech.net/api/v1/auth/universal-auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"clientId\":\"${{ secrets.INFISICAL_CLIENT_ID }}\",\"clientSecret\":\"${{ secrets.INFISICAL_CLIENT_SECRET }}\"}" \
            | jq -r '.accessToken')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Failed to authenticate with Infisical" >&2
            exit 1
          fi
          echo "::add-mask::$TOKEN"

          value=$(curl -fsS "https://infisical.rangeltech.net/api/v3/secrets/raw/LITELLM_MASTER_KEY?workspaceId=b4203358-1215-43a9-a821-218a6f587c3e&environment=prod&secretPath=%2F" \
            -H "Authorization: Bearer $TOKEN" | jq -r '.secret.secretValue')
          if [ -z "$value" ] || [ "$value" = "null" ]; then
            echo "::error::Secret LITELLM_MASTER_KEY not found in Infisical" >&2
            exit 1
          fi
          echo "::add-mask::$value"
          echo "litellm_master_key=$value" >> "$GITHUB_OUTPUT"
      - name: Deploy backend to Cloud Run
        env:
          LITELLM_MASTER_KEY: ${{ steps.infisical.outputs.litellm_master_key }}
        run: bash ./infra/deploy-cloudrun.sh
