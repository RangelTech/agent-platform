name: Infisical - set secret

# Utilitario reusavel: escreve/atualiza um secret no Infisical (projeto
# agent-platform, env prod) usando a mesma Machine Identity que o ci.yml ja
# usa pra LER segredos (LITELLM_MASTER_KEY, ANTIGRAVITY/GEMINI_CLI_OAUTH_
# CLIENT_SECRET). Existe porque nao ha acesso de UI/admin ao Infisical
# disponivel fora do GitHub Actions -- este workflow e o unico jeito de
# escrever secrets sem login humano na instancia. Mesmo padrao do
# `chatwoot-rt/.github/workflows/infisical-set-secret.yml`, so que
# apontado pro workspace deste repo (decisao do dono, 24/08/2026:
# Infisical e a fonte da verdade de todo segredo, nao GCP Secret Manager).
#
# Uso: Actions -> "Infisical - set secret" -> Run workflow, preencher
# secret_name e secret_value.

on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: "Nome do secret no Infisical (ex: OAUTH_BROWSER_ADMIN_TOKEN)"
        required: true
      secret_value:
        description: "Valor novo do secret"
        required: true
      probe_only:
        description: "Se 'true', so testa autenticacao (nao escreve nenhum secret)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  set-secret:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set secret in Infisical
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsS -X POST "https://infisical.rangeltech.net/api/v1/auth/universal-auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"clientId\":\"${{ secrets.INFISICAL_CLIENT_ID }}\",\"clientSecret\":\"${{ secrets.INFISICAL_CLIENT_SECRET }}\"}" \
            | jq -r '.accessToken')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Failed to authenticate with Infisical" >&2
            exit 1
          fi
          echo "::add-mask::$TOKEN"

          if [ "${{ inputs.probe_only }}" = "true" ]; then
            echo "--- who am I ---"
            curl -s "https://infisical.rangeltech.net/api/v2/users/me" -H "Authorization: Bearer $TOKEN"
            echo
            exit 0
          fi

          NAME="${{ inputs.secret_name }}"
          VALUE='${{ inputs.secret_value }}'
          echo "::add-mask::$VALUE"

          BODY=$(jq -n --arg v "$VALUE" '{workspaceId:"b4203358-1215-43a9-a821-218a6f587c3e",environment:"prod",secretPath:"/",secretValue:$v}')

          # Tenta update; se o secret nao existir ainda (404), cria.
          HTTP_CODE=$(curl -s -o /tmp/resp.json -w '%{http_code}' \
            -X PATCH "https://infisical.rangeltech.net/api/v3/secrets/raw/$NAME" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "$BODY")

          if [ "$HTTP_CODE" = "404" ]; then
            HTTP_CODE=$(curl -s -o /tmp/resp.json -w '%{http_code}' \
              -X POST "https://infisical.rangeltech.net/api/v3/secrets/raw/$NAME" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              -d "$BODY")
          fi

          echo "http_code=$HTTP_CODE"
          cat /tmp/resp.json
          if [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Infisical API returned $HTTP_CODE" >&2
            exit 1
          fi
          echo "OK: $NAME updated in Infisical"
