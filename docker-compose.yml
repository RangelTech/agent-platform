# Dev local: Postgres (pgvector) + backend com o SPA embutido. O kernel e
# outro repo (kernel-llm / kernel-harness); aponte KERNEL_URL para ele se
# precisar de chat com modelo. Sem ele, o backend sobe normalmente.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: agent_llm
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_llm"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://agent:agent@postgres:5432/agent_llm
      KERNEL_URL: ${KERNEL_URL:-http://host.docker.internal:8080}
      PORT: "8090"
      STORAGE_BACKEND: local
      STORAGE_LOCAL_DIR: /tmp/storage
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
