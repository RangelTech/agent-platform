name: Deploy backend+frontend to VPS

# agent-llm mega spec (infra-04): backend+frontend saem do Cloud Run e passam
# a rodar na VPS rangeltech.net, junto do resto do stack RT (vps_rt_infra).
# O kernel continua no Cloud Run — este workflow não mexe nele, isso é
# infra/deploy.sh (gcloud), disparado à parte.
#
# Segue o mesmo padrão do vps_rt_infra/.github/workflows/deploy-vps.yml:
# rsync + SSH, secrets de repositório, nada de credencial em texto no código.
# Pré-requisito único desta pipeline (não coberto aqui, é passo manual único
# de bootstrap): /opt/platform/agentllm/infra/.env.prod já existir na VPS,
# preenchido a partir de infra/.env.prod.example — nunca é sincronizado por
# aqui de propósito (contém segredo real).

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/docker-compose.prod.yml"
      - ".github/workflows/deploy-vps.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/vps_rt_infra_ed25519
          chmod 600 ~/.ssh/vps_rt_infra_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure remote directory exists
        run: |
          ssh -i ~/.ssh/vps_rt_infra_ed25519 \
            "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p /opt/platform/agentllm"

      - name: Rsync source to VPS
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/vps_rt_infra_ed25519" \
            --exclude ".env.prod" \
            backend frontend infra \
            "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}:/opt/platform/agentllm/"

      - name: Build and restart
        run: |
          ssh -i ~/.ssh/vps_rt_infra_ed25519 \
            "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/platform/agentllm && docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod build agentllm-backend && docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d --remove-orphans"

      - name: Smoke check
        run: |
          ssh -i ~/.ssh/vps_rt_infra_ed25519 \
            "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}" \
            "curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:8090/ || true"
