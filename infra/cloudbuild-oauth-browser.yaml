steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/containers/oauth-browser:$SHORT_SHA
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/containers/oauth-browser:latest
      - -f
      - oauth-browser/Dockerfile
      - .
images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/containers/oauth-browser:$SHORT_SHA
  - us-central1-docker.pkg.dev/$PROJECT_ID/containers/oauth-browser:latest
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
