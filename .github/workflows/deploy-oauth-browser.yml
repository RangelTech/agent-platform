name: Deploy OAuth Browser

on:
  push:
    branches: [main]
    paths:
      - "oauth-browser/**"
      - "infra/cloudbuild-oauth-browser.yaml"
      - "infra/terraform-oauth-browser/**"
      - ".github/workflows/deploy-oauth-browser.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: oauth-browser-cloudrun-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/234554472049/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-deployer@rangel-tech.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Fetch admin token from Infisical
        id: infisical
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsS --retry 4 --retry-all-errors -X POST "https://infisical.rangeltech.net/api/v1/auth/universal-auth/login" -H "Content-Type: application/json" -d "{\"clientId\":\"${{ secrets.INFISICAL_CLIENT_ID }}\",\"clientSecret\":\"${{ secrets.INFISICAL_CLIENT_SECRET }}\"}" | jq -r '.accessToken')
          test -n "$TOKEN" && test "$TOKEN" != null
          value=$(curl -fsS --retry 4 --retry-all-errors "https://infisical.rangeltech.net/api/v3/secrets/raw/OAUTH_BROWSER_ADMIN_TOKEN?workspaceId=b4203358-1215-43a9-a821-218a6f587c3e&environment=prod&secretPath=%2F" -H "Authorization: Bearer $TOKEN" | jq -r '.secret.secretValue')
          test -n "$value" && test "$value" != null
          echo "::add-mask::$value"
          { echo "admin_token<<EOF"; echo "$value"; echo "EOF"; } >> "$GITHUB_OUTPUT"

          proxy_value=$(curl -fsS --retry 4 --retry-all-errors "https://infisical.rangeltech.net/api/v3/secrets/raw/VPS_HTTP_PROXY_PASSWORD?workspaceId=b4203358-1215-43a9-a821-218a6f587c3e&environment=prod&secretPath=%2F" -H "Authorization: Bearer $TOKEN" | jq -r '.secret.secretValue')
          test -n "$proxy_value" && test "$proxy_value" != null
          echo "::add-mask::$proxy_value"
          { echo "vps_http_proxy_password<<EOF"; echo "$proxy_value"; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - name: Build image
        run: gcloud builds submit --project=rangel-tech --config=infra/cloudbuild-oauth-browser.yaml --substitutions=SHORT_SHA=${{ github.sha }} .
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.5" }
      - name: Apply
        working-directory: infra/terraform-oauth-browser
        env:
          TF_VAR_image: us-central1-docker.pkg.dev/rangel-tech/containers/oauth-browser:${{ github.sha }}
          TF_VAR_admin_token: ${{ steps.infisical.outputs.admin_token }}
          TF_VAR_vps_http_proxy_password: ${{ steps.infisical.outputs.vps_http_proxy_password }}
        run: |
          terraform init -input=false
          terraform import -input=false -lock=false google_cloud_run_v2_service.oauth_browser projects/rangel-tech/locations/us-central1/services/oauth-browser || true
          terraform import -input=false -lock=false google_cloud_run_v2_service_iam_member.public "projects/rangel-tech/locations/us-central1/services/oauth-browser roles/run.invoker allUsers" || true
          terraform apply -input=false -lock=false -auto-approve
      - name: Smoke check
        run: curl -fsS --retry 5 --retry-all-errors "$(gcloud run services describe oauth-browser --project=rangel-tech --region=us-central1 --format='value(status.url)')/health" | grep -q '"status":"ok"'
