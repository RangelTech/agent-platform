name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, kernel]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: agent_llm
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U agent -d agent_llm"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: ${{ matrix.service }}
        run: pip install -r requirements-dev.txt
      - name: Lint
        working-directory: ${{ matrix.service }}
        run: ruff check .
      - name: Test (unit + integration)
        working-directory: ${{ matrix.service }}
        env:
          DATABASE_URL: postgresql://agent:agent@localhost:5433/agent_llm
        run: python -m pytest -q -m "integration or not integration"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # Deploy só depois que backend, kernel e frontend passam, e só no main.
  # Antes disto o deploy era manual (`./infra/deploy.sh`), o que já custou duas
  # falhas silenciosas: trabalhar com `bq` no lake troca a conta ativa do gcloud
  # e o deploy morre com PERMISSION_DENIED no meio.
  #
  # A autenticação é por Workload Identity Federation — não há chave de service
  # account guardada como secret. O provedor OIDC só aceita tokens deste
  # repositório (attribute-condition), então um fork não consegue assumir a
  # identidade. Setup em infra/ci-deploy-setup.sh.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [python, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: eduk-prd-lake
          workload_identity_provider: projects/188258617713/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-deployer@eduk-prd-lake.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy kernel and backend
        run: bash ./infra/deploy.sh all
