name: CI

# Gate de qualidade (lint + testes). Nao faz deploy: a entrega
# e pelo workflow Release (tag v*) e quem implanta e o vps_rt_infra.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: agent_llm
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U agent -d agent_llm"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: Test (unit + integration)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://agent:agent@localhost:5433/agent_llm
        run: python -m pytest -q -m "integration or not integration"
