name: CI

# Kernel saiu deste repo (agent-llm mega spec, infra-05) — virou o repo
# kernel-llm, com seu próprio CI/CD (Cloud Run).
#
# Backend+frontend: migração pro Cloud Run em andamento (infra-01 seção 5,
# 21/08/2026) — job `deploy-cloudrun` abaixo sobe em PARALELO ao que já roda
# na VPS via `.github/workflows/deploy-vps.yml` (esse continua existindo e
# recebendo tráfego real até o corte de DNS ser decidido à parte). Diferente
# do deploy da VPS, este É gated por CI verde (`needs: [python, frontend]`) —
# achado de processo (memoria.md): o deploy da VPS nunca foi, fica registrado
# como pendência separada, não corrigido aqui.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: agent_llm
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U agent -d agent_llm"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: Test (unit + integration)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://agent:agent@localhost:5433/agent_llm
        run: python -m pytest -q -m "integration or not integration"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy-cloudrun:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [python, frontend]
    concurrency:
      group: agent-platform-cloudrun-production
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy backend to Cloud Run
        run: bash ./infra/deploy-cloudrun.sh
