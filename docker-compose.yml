services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: agent_llm
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_llm"]
      interval: 5s
      timeout: 3s
      retries: 10

  kernel:
    build:
      context: .
      dockerfile: kernel/Dockerfile
    environment:
      DATABASE_URL: postgresql://agent:agent@postgres:5432/agent_llm
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://agent:agent@postgres:5432/agent_llm
      KERNEL_URL: http://kernel:8080
      PORT: "8090"
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      kernel:
        condition: service_started

volumes:
  pg_data:
